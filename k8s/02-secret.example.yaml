# Exemplo de formato do Secret — NUNCA commitar valores reais.
#
# kubectl create secret generic billing-service-secret -n oficina-billing-service \
#   --from-literal=Jwt__Secret='...' \
#   --from-literal=Messaging__SnsTopicArn='arn:aws:sns:us-east-1:...:oficina-wagyu-saga-events' \
#   --from-literal=Messaging__SqsQueueUrl='https://sqs.us-east-1.amazonaws.com/.../oficina-wagyu-billing-queue' \
#   --from-literal=MercadoPago__AccessToken='TEST-...' \
#   --from-literal=MercadoPago__NotificationUrl='http://<ip-da-ec2>:30082/webhook/mercadopago' \
#   --from-literal=MercadoPago__WebhookSecret='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  namespace: oficina-billing-service
type: Opaque
stringData:
  Jwt__Secret: "COLE_AQUI_O_MESMO_SEGREDO_USADO_PELO_OS_SERVICE"
  Messaging__SnsTopicArn: "arn:aws:sns:us-east-1:<account-id>:oficina-wagyu-saga-events"
  Messaging__SqsQueueUrl: "https://sqs.us-east-1.amazonaws.com/<account-id>/oficina-wagyu-billing-queue"
  MercadoPago__AccessToken: "COLE_AQUI_O_ACCESS_TOKEN_DE_SANDBOX"
  MercadoPago__NotificationUrl: "http://<ip-da-ec2>:30082/webhook/mercadopago"
  MercadoPago__WebhookSecret: "COLE_AQUI_UM_SEGREDO_PROPRIO"
